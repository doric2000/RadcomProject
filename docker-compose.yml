services:
  # 1. The Broker (Redis) - manages the queue. Key for handling load.
  redis:
    image: redis:alpine
    container_name: radcom_redis
    ports:
      - "6379:6379"

  # 2. The Brain (FastAPI) - receives requests and sends them to the queue.
  backend:
    build: .
    container_name: radcom_backend
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app/app
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      - redis

  # 3. The Muscle (Celery Worker) - does the heavy background work.
  worker:
    build: .
    container_name: radcom_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./app:/app/app
      - ./models:/models
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  # 4. The Face (Streamlit) - the user interface.
  frontend:
    build: .
    container_name: radcom_frontend
    command: streamlit run app/streamlit_app.py
    volumes:
      - ./app:/app/app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
